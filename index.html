<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Script Executor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e14;
            color: #00ffcc;
            font-family: 'Consolas', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 480px;
        }

        .log-box {
            width: 100%;
            height: 160px;
            background: #121824;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .log-box::-webkit-scrollbar {
            width: 6px;
        }

        .log-box::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 3px;
        }

        .log-entry {
            line-height: 1.4;
            word-break: break-all;
        }

        .log-info { color: #a0aec0; }
        .log-success { color: #00ffcc; }
        .log-error { color: #ff5555; }
        .log-warn { color: #ffcc00; }

        .btn-execute {
            background: #00ffcc;
            color: #0b0e14;
            border: none;
            padding: 12px 36px;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .btn-execute:hover {
            background: #00e6b8;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transform: translateY(-1px);
        }

        .btn-execute:active {
            transform: translateY(0);
        }

        .btn-execute:disabled {
            background: #2d3748;
            color: #718096;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Centered Compact Log Container -->
        <div id="log-box" class="log-box"></div>

        <!-- Execute Button -->
        <button id="exec-btn" class="btn-execute" onclick="executeScript()">EXECUTE</button>
    </div>

    <script>
        // Core rendering function
        function printLog(msg, type = 'info') {
            const logBox = document.getElementById('log-box');
            if (!logBox) return;

            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            entry.textContent = `[${time}] ${msg}`;
            
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Define global `api` object immediately
        window.api = window.api || {};
        
        // Define api.log method
        window.api.log = function(...args) {
            const formattedMsg = args.map(arg => {
                if (typeof arg === 'object') {
                    try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                }
                return String(arg);
            }).join(' ');
            
            printLog(formattedMsg, 'info');
        };

        // Also proxy console.log, console.error, console.warn to api.log
        const origConsoleLog = console.log;
        const origConsoleErr = console.error;
        const origConsoleWarn = console.warn;

        console.log = function(...args) {
            origConsoleLog.apply(console, args);
            window.api.log(...args);
        };

        console.error = function(...args) {
            origConsoleErr.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            printLog(msg, 'error');
        };

        console.warn = function(...args) {
            origConsoleWarn.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            printLog(msg, 'warn');
        };

        // Welcome message on boot
        printLog('API listener attached to window.api.log', 'info');

        function executeScript() {
            const btn = document.getElementById('exec-btn');
            btn.disabled = true;

            printLog('Loading samirscripts.js...', 'info');

            // Remove previous script instance if present
            const oldScript = document.getElementById('dyn-samir-script');
            if (oldScript) {
                oldScript.remove();
            }

            // Dynamically load samirscripts.js
            const script = document.createElement('script');
            script.id = 'dyn-samir-script';
            script.src = './samirscripts.js?t=' + new Date().getTime();

            script.onload = function() {
                printLog('samirscripts.js loaded successfully.', 'success');
                btn.disabled = false;
            };

            script.onerror = function() {
                printLog('Error: Failed to fetch samirscripts.js', 'error');
                btn.disabled = false;
            };

            document.body.appendChild(script);
        }
    </script>
</body>
</html>
